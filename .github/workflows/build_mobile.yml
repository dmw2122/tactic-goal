name: Build mobile

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TacticGoal-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned app as IPA
        run: |
          mkdir -p packaging/Payload
          cp -R build/ios/iphoneos/Runner.app packaging/Payload/
          (cd packaging && zip -qr ../TacticGoal-iOS-IPA.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: TacticGoal-iOS-IPA
          path: TacticGoal-iOS-IPA.ipa
          if-no-files-found: error
